name: Convention Check

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch to diff against
        required: true
        default: develop
      dry_run:
        description: Skip PR comment and commit status updates
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  check:
    name: Convention Check
    runs-on: ubuntu-latest
    # Run on PR events, on manual dispatch, OR when a user with write access comments /check-conventions on a PR
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/check-conventions'))

    steps:
      - name: Check commenter write access (comment trigger)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['write', 'admin'].includes(data.permission)) {
              core.notice(`@${context.actor} does not have write access — ignoring /check-conventions`);
              process.exit(0);
            }

      - name: Get PR details (comment trigger)
        if: github.event_name == 'issue_comment'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('base_ref', pr.data.base.ref);

      - name: Checkout code
        uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          ref: ${{ github.event_name == 'issue_comment' && steps.pr.outputs.sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Fetch base branch
        if: ${{ !env.ACT }}
        run: git fetch origin ${{ github.event_name == 'issue_comment' && steps.pr.outputs.base_ref || github.event_name == 'pull_request' && github.base_ref || inputs.base_ref }}

      - name: Set up Node.js
        if: ${{ !env.ACT }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run convention checks
        id: checks
        run: |
          set +e
          MARKDOWN_OUTPUT=true node scripts/check-conventions.js "origin/${{ github.event_name == 'issue_comment' && steps.pr.outputs.base_ref || github.event_name == 'pull_request' && github.base_ref || inputs.base_ref }}" > convention-results.md 2>&1
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          {
            echo "result<<DELIMITER_EOF"
            cat convention-results.md
            echo "DELIMITER_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach results artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: convention-results
          path: convention-results.md

      - name: Add workflow summary
        run: |
          echo "## Convention Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat convention-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Determine check result
        id: status
        run: |
          if grep -q ":x: FAIL" convention-results.md; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "description=Convention check failed — fix FAIL items before merging" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            echo "description=All convention checks passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update PR comment
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue?.number || context.payload.pull_request?.number;
            const body = `## Convention Check Results\n\n${process.env.CHECK_RESULT}\n\n---\n*Auto-generated by convention checks. Fix FAIL items before merging. WARN items are advisory.*`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Convention Check Results')
            );
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });
        env:
          CHECK_RESULT: ${{ steps.checks.outputs.result }}

      - name: Set commit status
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event_name }}' === 'issue_comment'
              ? '${{ steps.pr.outputs.sha }}'
              : '${{ github.event_name }}' === 'pull_request'
                ? context.payload.pull_request.head.sha
                : context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: '${{ steps.status.outputs.conclusion }}',
              target_url: runUrl,
              description: '${{ steps.status.outputs.description }}',
              context: 'Convention Check'
            });

      - name: Fail if conventions violated
        if: steps.status.outputs.conclusion == 'failure'
        run: exit 1
