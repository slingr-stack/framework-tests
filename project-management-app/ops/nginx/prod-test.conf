# prod-test.conf — nginx config for local production smoke-testing.
#
# Mirrors the GCP load balancer URL map:
#   /graphql  → backend:3000   (GraphQL API)
#   /auth/*   → backend:3000   (Authentication endpoints)
#   /files    → backend:3000   (File upload endpoint)
#   /data/*   → backend:3000   (File download/data endpoints)
#   /**       → /usr/share/nginx/html (React SPA static files)
#
# The frontend container mounts apps/project-management-app/frontend/dist/
# at /usr/share/nginx/html, so run `npm run build` in frontend/ first.

server {
    listen 80;
    server_name localhost;

    # Proxy GraphQL requests to the backend
    location /graphql {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy auth endpoints to the backend
    location /auth/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy file uploads to the backend
    location /files {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy file downloads and contextual data endpoints to the backend
    location /data/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Serve the React SPA — return index.html for all unmatched routes
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
