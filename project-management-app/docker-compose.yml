services:
  mainDs-db:
    environment:
      POSTGRES_DB: project_management_app
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      interval: 2s
      retries: 15
      start_period: 10s
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      timeout: 5s
    image: postgres:15-alpine
    ports:
      - '5433:5432'
    volumes:
      - mainDs-data:/var/lib/postgresql/data
volumes:
  mainDs-data: null
